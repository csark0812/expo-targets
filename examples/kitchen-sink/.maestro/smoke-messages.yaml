appId: com.expotargets.example.kitchensink
name: kitchen-sink messages smoke
tags:
  - smoke
  - kitchen-sink
  - messages
---
- launchApp:
    clearState: true
- assertVisible:
    id: screen-root
- scrollUntilVisible:
    element:
      id: ks-messages-btn-seed-payload
    direction: DOWN
    timeout: 10000
- tapOn:
    id: ks-messages-btn-seed-payload
- assertVisible:
    id: ks-messages-text-last-payload
- tapOn:
    id: ks-messages-btn-clear-payload
