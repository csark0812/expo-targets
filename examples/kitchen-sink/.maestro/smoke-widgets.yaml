appId: com.expotargets.example.kitchensink
name: kitchen-sink widgets smoke
tags:
  - smoke
  - kitchen-sink
  - widgets
---
- launchApp:
    clearState: true
- assertVisible:
    id: screen-root
- scrollUntilVisible:
    element:
      id: ks-widgets-btn-seed-payload
    direction: DOWN
    timeout: 10000
- tapOn:
    id: ks-widgets-btn-seed-payload
- assertVisible:
    id: ks-widgets-text-last-payload
- tapOn:
    id: ks-widgets-btn-clear-payload
