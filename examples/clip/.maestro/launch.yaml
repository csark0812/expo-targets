appId: com.expotargets.example.clip
name: clip real launch
tags:
  - launch
  - clip
  - process
---
# PR C — real clip launch (Release build). Failure gate: stop and re-grill if this cannot green.
- launchApp:
    clearState: true
- assertVisible:
    id: screen-root
- tapOn:
    id: btn-clear-payload
- openLink: expotargets-clip://demo?item=launch&price=1
- runFlow:
    when:
      visible: "Open"
    file: ../../.maestro/subflows/ios-open-security-dialog.yaml
- launchApp
- assertVisible:
    id: screen-root
- tapOn:
    id: btn-refresh
- assertVisible:
    id: text-last-payload
